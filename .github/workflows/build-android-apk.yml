name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-wrapper/**"
      - "index.html"
      - "app.js"
      - "styles.css"
      - "side-system.js"
      - "health-connect.js"
      - "manifest.webmanifest"
      - "icon.svg"
      - "enter_the_system_landscape.jpg"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Package SYSTEM web app
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check side-system.js
          WEB="android-wrapper/app/src/main/assets/www"
          rm -rf "$WEB"
          mkdir -p "$WEB"
          cp index.html app.js styles.css side-system.js health-connect.js manifest.webmanifest icon.svg enter_the_system_landscape.jpg sw.js "$WEB"/
          grep -q "V42 ORBIT RUNTIME PROBE" "$WEB/app.js"
          echo "Verified V42 orbit runtime in packaged app.js"
          test -s "$WEB/enter_the_system_landscape.jpg"
          file "$WEB/enter_the_system_landscape.jpg" | grep -q '1672x941'
          grep -q 'src="enter_the_system_landscape.jpg?v=86"' "$WEB/index.html"
          grep -q 'not(.workout-mode):not(.mission-launch-confirm)' "$WEB/styles.css"
          grep -q 'grid-template-columns:minmax(230px,32%)' "$WEB/styles.css"
          grep -q 'id="timedSetClock"' "$WEB/index.html"
          grep -q 'function timedTargetSeconds(target)' "$WEB/app.js"
          grep -q 'function sideFmt(n)' "$WEB/side-system.js"
          echo "Verified full-resolution landscape entry artwork"
          echo "Packaged web assets:"
          find "$WEB" -maxdepth 1 -type f -printf "%f\n" | sort

      - name: Restore persistent signing key
        shell: bash
        env:
          SYSTEM_KEYSTORE_BASE64: ${{ secrets.SYSTEM_KEYSTORE_BASE64 }}
        run: |
          test -n "$SYSTEM_KEYSTORE_BASE64"
          printf '%s' "$SYSTEM_KEYSTORE_BASE64" | base64 --decode > android-wrapper/system-debug.keystore

      - name: Build debug APK
        working-directory: android-wrapper
        env:
          SYSTEM_KEYSTORE_PASSWORD: ${{ secrets.SYSTEM_KEYSTORE_PASSWORD }}
          SYSTEM_KEY_ALIAS: ${{ secrets.SYSTEM_KEY_ALIAS }}
          SYSTEM_KEY_PASSWORD: ${{ secrets.SYSTEM_KEY_PASSWORD }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK signature and package
        shell: bash
        run: |
          set -euo pipefail
          APK="android-wrapper/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" | head -1
          unzip -p "$APK" assets/www/app.js | grep -q "ORBIT V42 // LIVE"
          unzip -l "$APK" | grep -q "assets/www/enter_the_system_landscape.jpg"
          cmp enter_the_system_landscape.jpg <(unzip -p "$APK" assets/www/enter_the_system_landscape.jpg)
          cmp styles.css <(unzip -p "$APK" assets/www/styles.css)
          cmp app.js <(unzip -p "$APK" assets/www/app.js)
          cmp index.html <(unzip -p "$APK" assets/www/index.html)
          unzip -l "$APK" | grep -q "res/drawable-nodpi-v4/ic_system_launcher.jpg"
          cmp side-system.js <(unzip -p "$APK" assets/www/side-system.js)
          unzip -p "$APK" assets/www/index.html | grep -q 'src="enter_the_system_landscape.jpg?v=86"'
          echo "APK signature, package metadata, and current runtime verified"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: the-system-v92-launcher-icon-debug-apk
          path: android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
