name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-wrapper/**"
      - "index.html"
      - "app.js"
      - "styles.css"
      - "side-system.js"
      - "health-connect.js"
      - "manifest.webmanifest"
      - "icon.svg"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Package SYSTEM web app
        shell: bash
        run: |
          set -euo pipefail
          WEB="android-wrapper/app/src/main/assets/www"
          rm -rf "$WEB"
          mkdir -p "$WEB"
          cp index.html app.js styles.css side-system.js health-connect.js manifest.webmanifest icon.svg sw.js "$WEB"/
          echo "Packaged web assets:"
          find "$WEB" -maxdepth 1 -type f -printf "%f\n" | sort

      - name: Restore persistent signing key
        shell: bash
        env:
          SYSTEM_KEYSTORE_BASE64: ${{ secrets.SYSTEM_KEYSTORE_BASE64 }}
        run: |
          test -n "$SYSTEM_KEYSTORE_BASE64"
          printf '%s' "$SYSTEM_KEYSTORE_BASE64" | base64 --decode > android-wrapper/system-debug.keystore

      - name: Build debug APK
        working-directory: android-wrapper
        env:
          SYSTEM_KEYSTORE_PASSWORD: ${{ secrets.SYSTEM_KEYSTORE_PASSWORD }}
          SYSTEM_KEY_ALIAS: ${{ secrets.SYSTEM_KEY_ALIAS }}
          SYSTEM_KEY_PASSWORD: ${{ secrets.SYSTEM_KEY_PASSWORD }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: the-system-v39-debug-apk
          path: android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
