name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main, health-membership-foundation, adaptive-training]
    paths:
      - "android-wrapper/**"
      - "index.html"
      - "app.js"
      - "adaptive-training.js"
      - "train-together.js"
      - "competitive-credits.js"
      - "tests/train-together.test.cjs"
      - "supabase/migrations/**"
      - "diagnostics.js"
      - "account-data.js"
      - "tests/account-data.test.cjs"
      - "tests/account-isolation.test.cjs"
      - "tests/**"
      - "sw.js"
      - "styles.css"
      - "workout-help.js"
      - "system-assistant.js"
      - "health-insights.js"
      - "sleep-tracker.js"
      - ".github/workflows/build-android-apk.yml"
      - "side-system.js"
      - "side-system.css"
      - "health-connect.js"
      - "manifest.webmanifest"
      - "icon.svg"
      - "enter_the_system_landscape.jpg"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify solo and Train Together flows
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/train-tests" @electric-sql/pglite@0.3.14 jsdom@26.1.0 playwright@1.58.2
          JSDOM_MODULE="$RUNNER_TEMP/train-tests/node_modules/jsdom" PGLITE_MODULE="$RUNNER_TEMP/train-tests/node_modules/@electric-sql/pglite" node tests/train-together.test.cjs

      - name: Verify session switch on landscape phones
        shell: bash
        run: |
          node "$RUNNER_TEMP/train-tests/node_modules/playwright/cli.js" install --with-deps chromium
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/train-tests/node_modules/playwright" node tests/session-equipment-layout.test.cjs
          NODE_PATH="$RUNNER_TEMP/train-tests/node_modules" node tests/onboarding-layout.test.cjs
          NODE_PATH="$RUNNER_TEMP/train-tests/node_modules" node tests/command-workspace-layout.test.cjs
          NODE_PATH="$RUNNER_TEMP/train-tests/node_modules" node tests/system-assistant-layout.test.cjs
          NODE_PATH="$RUNNER_TEMP/train-tests/node_modules" node tests/sleep-tracker-layout.test.cjs
          NODE_PATH="$RUNNER_TEMP/train-tests/node_modules" node tests/adaptive-training-layout.test.cjs

      - name: Upload UI previews
        uses: actions/upload-artifact@v4
        with:
          name: Command-UI-Previews
          path: command-ui-previews/*.png

      - name: Package SYSTEM web app
        shell: bash
        run: |
          set -euo pipefail
          node --check competitive-credits.js
          node --check train-together.js
          node --check adaptive-training.js
          node tests/adaptive-training.test.cjs
          JSDOM_MODULE="$RUNNER_TEMP/train-tests/node_modules/jsdom" node tests/adaptive-training-integration.test.cjs
          node --check app.js
          node tests/session-equipment.test.cjs
          node --check diagnostics.js
          node tests/diagnostics.test.cjs
          node --check account-data.js
          node tests/account-data.test.cjs
          node tests/account-isolation.test.cjs
          node tests/competitive-credits.test.cjs
          JSDOM_MODULE="$RUNNER_TEMP/train-tests/node_modules/jsdom" node tests/recovery.test.cjs
          JSDOM_MODULE="$RUNNER_TEMP/train-tests/node_modules/jsdom" node tests/render-security.test.cjs
          PGLITE_MODULE="$RUNNER_TEMP/train-tests/node_modules/@electric-sql/pglite" node tests/social-security.test.cjs
          node tests/health-connect.test.cjs
          JSDOM_MODULE="$RUNNER_TEMP/train-tests/node_modules/jsdom" node tests/health-dashboard.test.cjs
          NODE_PATH="$RUNNER_TEMP/train-tests/node_modules" node tests/debrief-layout.test.cjs
          JSDOM_MODULE="$RUNNER_TEMP/train-tests/node_modules/jsdom" node tests/fuel-recovery.test.cjs
          node tests/endurance-assessment.test.cjs
          NODE_PATH="$RUNNER_TEMP/train-tests/node_modules" node tests/endurance-ui.test.cjs
          node tests/sleep-tracker.test.cjs
          NODE_PATH="$RUNNER_TEMP/train-tests/node_modules" node tests/health-dashboard.test.cjs
          node tests/health-insights.test.cjs
          node tests/system-assistant.test.cjs
          JSDOM_MODULE="$RUNNER_TEMP/train-tests/node_modules/jsdom" node tests/system-assistant-integration.test.cjs
          node --check system-assistant.js
          node --check workout-help.js
          NODE_PATH="$RUNNER_TEMP/train-tests/node_modules" node tests/workout-help.test.cjs
          node --check side-system.js
          WEB="android-wrapper/app/src/main/assets/www"
          rm -rf "$WEB"
          mkdir -p "$WEB"
          cp adaptive-training.js sleep-tracker.js health-insights.js system-assistant.js workout-help.js diagnostics.js index.html app.js competitive-credits.js train-together.js account-data.js styles.css side-system.css side-system.js health-connect.js manifest.webmanifest icon.svg enter_the_system_landscape.jpg sw.js "$WEB"/
          grep -q "V42 ORBIT RUNTIME PROBE" "$WEB/app.js"
          echo "Verified V42 orbit runtime in packaged app.js"
          test -s "$WEB/enter_the_system_landscape.jpg"
          grep -q '1672x941' <(file "$WEB/enter_the_system_landscape.jpg")
          grep -q 'src="enter_the_system_landscape.jpg?v=86"' "$WEB/index.html"
          grep -q 'not(.workout-mode):not(.mission-launch-confirm)' "$WEB/styles.css"
          grep -q 'grid-template-columns:minmax(230px,32%)' "$WEB/styles.css"
          grep -q 'id="timedSetClock"' "$WEB/index.html"
          grep -q 'function timedTargetSeconds(target)' "$WEB/app.js"
          grep -q 'function sideFmt(n)' "$WEB/side-system.js"
          echo "Verified full-resolution landscape entry artwork"
          echo "Packaged web assets:"
          find "$WEB" -maxdepth 1 -type f -printf "%f\n" | sort

      - name: Restore persistent signing key
        shell: bash
        env:
          SYSTEM_KEYSTORE_BASE64: ${{ secrets.SYSTEM_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SYSTEM_KEYSTORE_BASE64" ]; then echo "::error::SYSTEM_KEYSTORE_BASE64 secret is missing; persistent signing key is required for update-compatible APKs."; exit 1; fi
          printf '%s' "$SYSTEM_KEYSTORE_BASE64" | base64 --decode > android-wrapper/system-debug.keystore

      - name: Build debug APK
        working-directory: android-wrapper
        env:
          SYSTEM_KEYSTORE_PASSWORD: ${{ secrets.SYSTEM_KEYSTORE_PASSWORD }}
          SYSTEM_KEY_ALIAS: ${{ secrets.SYSTEM_KEY_ALIAS }}
          SYSTEM_KEY_PASSWORD: ${{ secrets.SYSTEM_KEY_PASSWORD }}
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Verify APK signature and package
        shell: bash
        run: |
          set -euo pipefail
          APK="android-wrapper/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" | head -1
          grep -q "ORBIT V42 // LIVE" <(unzip -p "$APK" assets/www/app.js)
          unzip -Z1 "$APK" | grep -Fx "assets/www/enter_the_system_landscape.jpg"
          cmp enter_the_system_landscape.jpg <(unzip -p "$APK" assets/www/enter_the_system_landscape.jpg)
          cmp styles.css <(unzip -p "$APK" assets/www/styles.css)
          cmp side-system.css <(unzip -p "$APK" assets/www/side-system.css)
          cmp app.js <(unzip -p "$APK" assets/www/app.js)
          cmp diagnostics.js <(unzip -p "$APK" assets/www/diagnostics.js)
          cmp account-data.js <(unzip -p "$APK" assets/www/account-data.js)
          cmp competitive-credits.js <(unzip -p "$APK" assets/www/competitive-credits.js)
          cmp adaptive-training.js <(unzip -p "$APK" assets/www/adaptive-training.js)
          cmp sleep-tracker.js <(unzip -p "$APK" assets/www/sleep-tracker.js)
          cmp health-insights.js <(unzip -p "$APK" assets/www/health-insights.js)
          cmp index.html <(unzip -p "$APK" assets/www/index.html)
          unzip -Z1 "$APK" | grep -Fx "res/drawable-nodpi-v4/ic_system_launcher.jpg"
          cmp workout-help.js <(unzip -p "$APK" assets/www/workout-help.js)
          cmp side-system.js <(unzip -p "$APK" assets/www/side-system.js)
          grep -q 'src="enter_the_system_landscape.jpg?v=86"' <(unzip -p "$APK" assets/www/index.html)
          echo "APK signature, package metadata, and current runtime verified"

      - name: Name APK with version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android-wrapper/app/build.gradle.kts | head -1)"
          VERSION_CODE="$(sed -n 's/.*versionCode = \([0-9][0-9]*\).*/\1/p' android-wrapper/app/build.gradle.kts | head -1)"
          test -n "$VERSION_NAME"
          test -n "$VERSION_CODE"
          OUT="android-wrapper/app/build/outputs/apk/debug/The-System-v${VERSION_NAME}-build${VERSION_CODE}.apk"
          cp android-wrapper/app/build/outputs/apk/debug/app-debug.apk "$OUT"
          echo "APK_PATH=$OUT" >> "$GITHUB_ENV"
          echo "APK_LABEL=The-System-v${VERSION_NAME}-build${VERSION_CODE}" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_LABEL }}
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14


