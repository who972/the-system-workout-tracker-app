name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android-wrapper/**"
      - "index.html"
      - "app.js"
      - "styles.css"
      - "side-system.js"
      - "health-connect.js"
      - "manifest.webmanifest"
      - "icon.svg"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Package SYSTEM web app
        shell: bash
        run: |
          set -euo pipefail
          WEB="android-wrapper/app/src/main/assets/www"
          rm -rf "$WEB"
          mkdir -p "$WEB"
          cp index.html app.js styles.css side-system.js health-connect.js manifest.webmanifest icon.svg sw.js "$WEB"/
          grep -q "V42 ORBIT RUNTIME PROBE" "$WEB/app.js"
          echo "Verified V42 orbit runtime in packaged app.js"
          echo "Packaged web assets:"
          find "$WEB" -maxdepth 1 -type f -printf "%f\n" | sort

      - name: Restore persistent signing key
        shell: bash
        env:
          SYSTEM_KEYSTORE_BASE64: ${{ secrets.SYSTEM_KEYSTORE_BASE64 }}
        run: |
          test -n "$SYSTEM_KEYSTORE_BASE64"
          printf '%s' "$SYSTEM_KEYSTORE_BASE64" | base64 --decode > android-wrapper/system-debug.keystore

      - name: Build debug APK
        working-directory: android-wrapper
        env:
          SYSTEM_KEYSTORE_PASSWORD: ${{ secrets.SYSTEM_KEYSTORE_PASSWORD }}
          SYSTEM_KEY_ALIAS: ${{ secrets.SYSTEM_KEY_ALIAS }}
          SYSTEM_KEY_PASSWORD: ${{ secrets.SYSTEM_KEY_PASSWORD }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK signature and package
        shell: bash
        run: |
          set -euo pipefail
          APK="android-wrapper/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$AAPT" dump badging "$APK" | head -1
          unzip -p "$APK" assets/www/app.js | grep -q "ORBIT V42 // LIVE"
          echo "APK signature, package metadata, and V42 runtime verified"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: the-system-v42-debug-apk
          path: android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
